<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Strong With Sherni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#2D322C; --cream:#FAF9F3; --white:#FFFFFF;
    --maroon:#7B0237; --teal:#1F4037; --coral:#FF833B; --mustard:#9C9C1E;
    --taupe:#6B6459; --line:rgba(45,50,44,0.13);
    --red:#DC2626; --orange:#D97706; --pink:#B0576F; --green:#4D8A1F; --gray:#9CA3AF;
  }
  *{box-sizing:border-box;}
  body{ font-family:'Work Sans', sans-serif; background:var(--cream); color:var(--ink); margin:0; }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; margin:0; }
  input, select, textarea{ font-family:'Work Sans', sans-serif; }
  .hidden{ display:none !important; }

  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .login-box{ width:100%; max-width:360px; }
  .login-brand{ text-align:center; margin-bottom:24px; }
  .login-brand .emoji{ font-size:36px; }
  .login-brand h1{ font-size:22px; color:var(--maroon); margin-top:4px; }
  .login-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
  .field{ margin-bottom:16px; }
  .field label{ font-size:12px; color:var(--taupe); display:block; margin-bottom:5px; font-weight:600; }
  .field input, .field select, .field textarea{ width:100%; padding:10px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:13.5px; background:var(--white); color:var(--ink); }
  .btn-primary{ background:var(--maroon); color:#fff; border:none; border-radius:8px; padding:11px 22px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .btn-secondary{ background:#fff; color:var(--ink); border:1px solid #D1D5DB; border-radius:8px; padding:11px 22px; cursor:pointer; font-size:13.5px; }
  .btn-wa{ background:#25D366; color:#fff; border:none; border-radius:8px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
  .error-msg{ font-size:12px; color:var(--red); margin-bottom:12px; padding:8px 12px; background:#FEE2E2; border-radius:6px; }

  #dashboard-screen{ padding:1.5rem clamp(1rem,4vw,3rem); }
  .dash-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .dash-header h1{ font-size:20px; color:var(--maroon); }
  .dash-header .sub{ font-size:12px; color:var(--taupe); margin-top:3px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .tabs{ display:flex; gap:4px; background:#EFEAE2; border-radius:10px; padding:4px; width:fit-content; margin-bottom:24px; max-width:100%; overflow-x:auto; }
  .tab-btn{ padding:8px 18px; font-size:13px; cursor:pointer; border:none; border-radius:8px; background:transparent; color:var(--taupe); font-weight:500; }
  .tab-btn.active{ background:var(--maroon); color:#fff; font-weight:600; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  .stat-card{ border-radius:10px; padding:14px 16px; }
  .stat-card .lbl{ font-size:11px; margin:0 0 4px; }
  .stat-card .val{ font-size:26px; font-weight:700; margin:0; }
  @media (max-width:700px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }

  .chart-grid{ display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:16px; margin-bottom:24px; }
  .chart-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; }
  .chart-card h4{ font-size:13px; font-weight:700; color:#374151; margin-bottom:14px; font-family:'Work Sans',sans-serif; }
  .chart-card .chart-wrap{ position:relative; height:220px; }
  .chart-card .empty-note{ text-align:center; color:var(--taupe); font-size:12.5px; padding-top:70px; }
  @media (max-width:960px){ .chart-grid{ grid-template-columns:1fr; } }

  .filter-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-row input, .filter-row select{ padding:9px 12px; border:1px solid #D1D5DB; border-radius:8px; font-size:13px; }
  .filter-row input{ flex:1; min-width:180px; }
  @media (max-width:480px){ .filter-row input, .filter-row select{ min-width:0; width:100%; } }
  .expired-divider{ display:flex; align-items:center; gap:10px; margin:18px 0 4px; }
  .expired-divider span{ font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:0.5px; }
  .expired-divider .line{ flex:1; height:1px; background:var(--line); }

  .client-card{ background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); margin-bottom:10px; }
  .client-top{ padding:16px 20px; }
  .client-row1{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .client-name{ font-size:15px; font-weight:700; margin:0; }
  .client-sub{ font-size:12px; color:var(--taupe); margin:3px 0 0; }
  .badges{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .badge{ font-size:11px; padding:2px 9px; border-radius:6px; font-weight:600; }
  .mini-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(95px,1fr)); gap:6px; margin-bottom:12px; }
  .mini-cell{ background:var(--cream); border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  .mini-cell .k{ font-size:10px; color:#9CA3AF; margin:0 0 2px; }
  .mini-cell .v{ font-size:13px; font-weight:600; margin:0; }
  .call-status{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .call-badge{ font-size:12px; padding:3px 10px; border-radius:6px; font-weight:500; }
  .more-btn{ margin-left:auto; background:transparent; border:none; cursor:pointer; font-size:12px; color:var(--teal); font-weight:600; }
  .client-expand{ border-top:1px solid var(--line); padding:16px 20px; background:var(--cream); display:none; }
  .client-expand.open{ display:block; }
  .phase-btn{ padding:4px 12px; border-radius:6px; border:1px solid #D1D5DB; font-size:12px; cursor:pointer; background:#fff; color:var(--taupe); margin-right:6px; }
  .phase-btn.active{ background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600; }
  .edit-btn, .del-btn{ font-size:12px; padding:5px 12px; border-radius:8px; cursor:pointer; }
  .edit-btn{ background:#fff; border:1px solid #D1D5DB; color:var(--ink); }
  .del-btn{ background:transparent; border:none; color:var(--red); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:1rem; }
  .modal-box{ background:#fff; border-radius:16px; padding:1.75rem; width:100%; max-width:520px; max-height:92vh; overflow-y:auto; }
  @media (max-width:480px){ .modal-box{ padding:1.1rem; border-radius:12px; } }
  .modal-box h3{ font-size:17px; margin-bottom:20px; }
  .section-label{ font-size:12px; font-weight:700; color:var(--maroon); text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .form-grid .full{ grid-column:1/-1; }
  @media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }

  .reminder-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:12px; }
  .reminder-box.urgent{ background:#FCEBEB; border-color:#F09595; }
  .reminder-box.soon{ background:#FAEEDA; border-color:#FAC775; }
  .reminder-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
  .reminder-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(0,0,0,0.06); font-size:13px; }
  .ref-line{ font-size:12px; color:var(--taupe); margin:6px 0 10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .ref-chip{ font-size:11.5px; font-weight:700; letter-spacing:1px; background:#F3E8EE; color:var(--maroon); padding:3px 9px; border-radius:6px; }
  .btn-portal{ background:#fff; border:1px solid var(--maroon); color:var(--maroon); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600; text-decoration:none; }
  .tbl{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; color:var(--taupe); text-transform:uppercase; letter-spacing:.5px; padding:10px 14px; background:#FBF8F2; border-bottom:1px solid var(--line); }
  .tbl td{ padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl tr:last-child td{ border-bottom:0; }
  .rn-btn{ font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid #D1D5DB; background:#fff; cursor:pointer; margin-left:4px; }
  .rn-btn.on-yes{ background:#EAF3DE; border-color:#3B6D11; color:#3B6D11; font-weight:700; }
  .rn-btn.on-no{ background:#FCEBEB; border-color:#A32D2D; color:#A32D2D; font-weight:700; }
  .demo-bar{ background:#FBF1DE; color:#7A5212; border:1px solid #F1DDB5; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; margin-bottom:14px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2D322C; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; transition:.2s; z-index:300; pointer-events:none; }
  .toast.on{ opacity:1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <div class="emoji">🦁</div>
      <h1>Strong With Sherni</h1>
      <p style="font-size:13px;color:var(--taupe);margin-top:4px;">Admin Dashboard</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your admin password" onkeydown="if(event.key==='Enter')handleLogin()">
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button class="btn-primary" style="width:100%;padding:12px;" onclick="handleLogin()">Login</button>
    </div>
  </div>
</div>

<div id="dashboard-screen" class="hidden">
  <div class="demo-bar hidden" id="demo-bar">Demo with sample clients. Nothing here is saved.</div>
  <div class="dash-header">
    <div>
      <h1>🦁 Strong With Sherni</h1>
      <p class="sub">Admin Dashboard <span id="save-status" style="color:var(--green);margin-left:6px;"></span></p>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" id="alerts-btn" onclick="enableAlerts()">🔔 Phone alerts</button>
      <button class="btn-secondary" onclick="exportCSV()">↓ CSV</button>
      <button class="btn-primary" onclick="openAddModal()">+ Add Client</button>
      <button class="btn-secondary" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="clients" onclick="switchTab('clients')">Clients</button>
    <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders')">Reminders & Renewals</button>
    <button class="tab-btn" data-tab="referrals" onclick="switchTab('referrals')">Referrals</button>
    <button class="tab-btn" data-tab="growth" onclick="switchTab('growth')">Growth</button>
  </div>

  <div id="tab-overview"></div>
  <div id="tab-clients" class="hidden"></div>
  <div id="tab-reminders" class="hidden"></div>
  <div id="tab-referrals" class="hidden"></div>
  <div id="tab-growth" class="hidden"></div>
</div>

<div id="client-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modal-title">Add New Client</h3>

    <p class="section-label">Basic Info</p>
    <div class="form-grid">
      <div class="full field"><label>Full name *</label><input id="f-name"></div>
      <div class="field"><label>Email *</label><input id="f-email" type="email"></div>
      <div class="field"><label>Amount paid (₹)</label><input id="f-amount" type="number" min="0" placeholder="e.g. 19499"></div>
      <input id="f-password" type="hidden">
      <div class="full field"><label>Phone (for WhatsApp reminders)</label><input id="f-phone" placeholder="+91 XXXXX XXXXX"></div>
    </div>

    <p class="section-label">Programme</p>
    <div class="form-grid">
      <div class="field"><label>Join date *</label><input id="f-join" type="date"></div>
      <div class="field"><label>Payment date</label><input id="f-payment" type="date"></div>
      <div class="field"><label>Duration</label>
        <select id="f-duration"><option>3 months</option><option>4 months</option><option>6 months</option><option>12 months</option><option>1 hour</option><option>7 days</option><option>10 days</option><option>14 days</option><option>21 days</option><option>30 days</option></select>
      </div>
      <div class="field"><label>Phase length (phases change automatically)</label>
        <select id="f-phaseweeks"><option value="4">4 weeks per phase</option><option value="6">6 weeks per phase</option></select>
      </div>
      <div class="field"><label>Pause days</label><input id="f-pause" type="number" min="0" value="0"></div>
      <div class="field"><label>Extension days</label><input id="f-ext" type="number" min="0" value="0"></div>
      <div class="field"><label>Referral bonus days (auto +10 per friend)</label><input id="f-ref" type="number" min="0" value="0"></div>
      <div class="field"><label>Payment status</label>
        <select id="f-paystatus"><option value="paid">Paid</option><option value="pending">Pending</option></select>
      </div>
      <div class="full field"><label>Referred by (they get +10 days automatically)</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="f-refcode" placeholder="Type their code, e.g. PRIYANKA482" style="flex:1;min-width:180px;text-transform:uppercase" oninput="matchRefCode()">
          <select id="f-referredby" style="flex:1;min-width:180px" onchange="document.getElementById('f-refmsg').textContent=''"><option value="">— Nobody —</option></select>
        </div>
        <div id="f-refmsg" style="font-size:12.5px;font-weight:600;margin-top:5px"></div>
      </div>
    </div>

    <p class="section-label">Onboarding</p>
    <div class="form-grid">
      <div class="field"><label>Onboarding date</label><input id="f-onboard-date" type="date"></div>
      <div>
        <div class="checkbox-row"><input type="checkbox" id="f-intro"> Intro call done</div>
        <div class="checkbox-row"><input type="checkbox" id="f-onboard"> Onboarding call done</div>
      </div>
    </div>

    <p class="section-label">Client portal</p>
    <div class="form-grid">
      <div class="full field"><label>Note for the client (shows at the top of their portal)</label><textarea id="f-coachnote" style="min-height:56px" placeholder="e.g. So proud of your consistency this month! 💛"></textarea></div>
    </div>

    <p class="section-label">Renewal</p>
    <div class="form-grid">
      <div class="field"><label>Renewal status</label>
        <select id="f-renewal"><option value="">Not decided yet</option><option value="renewed">Renewed</option><option value="not_renewed">Not renewing</option></select>
      </div>
      <div class="field"><label>Why / note</label><input id="f-renewalnote" placeholder="e.g. Price, travelling, happy with results"></div>
    </div>

    <p class="section-label">Private notes (only you see these)</p>
    <textarea id="f-notes" style="width:100%;min-height:64px;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:13px;"></textarea>

    <div id="modal-error" class="error-msg hidden" style="margin-top:12px;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveClient()">Save</button>
    </div>
  </div>
</div>

<script>
  // All data goes through /api/clients (server). The password is checked on the server, never stored in this page.
  const DEMO = /[?&]demo/.test(location.search) || !/strongwithsherni\.com|localhost/.test(location.host);
  const TKEY = "sws_admin_token";
  const DURATIONS = { "3 months": 90, "4 months": 120, "6 months": 180, "12 months": 365, "1 hour": 1, "7 days": 7, "10 days": 10, "14 days": 14, "21 days": 21, "30 days": 30 };
  const STRIPE_COLOR = { critical:"#DC2626", warning:"#D97706", soon:"#B0576F", active:"#4D8A1F", expired:"#9CA3AF", unknown:"#D1D5DB" };

  let clients = [];
  let token = ""; try{ token = localStorage.getItem(TKEY)||""; }catch(e){}
  async function api(body){
    if(DEMO) return demoApi(body);
    const r = await fetch("/api/clients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body, token})});
    const j = await r.json().catch(()=>({}));
    if(r.status===401 && body.action!=="admin_login"){ handleLogout(); throw new Error(j.error||"Please log in again."); }
    if(!r.ok) throw new Error(j.error||"Something went wrong.");
    return j;
  }
  function toast(t){ let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); } el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200); }
  const byId = id => clients.find(x=>x.id===id);
  const firstName = n => String(n||"").trim().split(/\s+/)[0];
  function referralsOf(c){ return clients.filter(x=>x.referred_by===c.id); }
  function portalMsg(c){
    return `Hi ${firstName(c.name)}, this is Anshika from Coach Vanshika's team at Strong With Sherni.\n\nWe've created a personal progress page just for you. You can see your days left, your current phase, the milestones you've unlocked, and track your own measurements (only you can see them).\n\nYour page: ${c.portal}\n\nYou'll also find your referral code there: ${c.ref_code||"-"}. Every friend who joins with it adds 10 extra days to your plan.\n\nNo login needed. Just tap the link and save it to check in anytime.`;
  }
  async function copyPortal(id){ const c=byId(id); try{ await navigator.clipboard.writeText(c.portal); toast("Portal link copied"); }catch(e){ prompt("Copy the link:", c.portal); } }
  let editingId = null;

  function calcEnd(c){
    if(!c.join_date) return null;
    const d = new Date(c.join_date);
    d.setDate(d.getDate() + DURATIONS[c.duration] + Number(c.pause_days||0) + Number(c.extension_days||0) + Number(c.referral_days||0));
    return d;
  }
  // ---- Automatic phases: Phase 1 -> 4, each lasts phase_weeks (4 default, 6 optional). Pause days push changes later. Stays on Phase 4. ----
  function isChallenge(c){ return c.phase==="Challenge"; }
  function isTrial(c){ return c.phase==="Trial" || c.duration==="1 hour" || isChallenge(c); }
  function phaseStart(c){
    const d = new Date(c.join_date); d.setHours(0,0,0,0);
    d.setDate(d.getDate() + Number(c.pause_days||0));
    return d;
  }
  // Manual override: when you set a phase by hand, the count restarts from that day (e.g. set Phase 3 today -> Phase 4 after the phase length).
  function phaseBase(c){
    const m = /Phase (\d)/.exec(c.phase_override||"");
    if(m && c.phase_override_date){ const d = new Date(c.phase_override_date); d.setHours(0,0,0,0); return { n0:Number(m[1]), start:d, manual:true }; }
    return { n0:1, start:phaseStart(c), manual:false };
  }
  function phaseLen(c){ return (Number(c.phase_weeks)||4)*7; }
  function phaseNum(c){
    if(!c.join_date) return 1;
    const b = phaseBase(c);
    const elapsed = Math.max(0, Math.floor((new Date() - b.start)/86400000));
    return Math.min(4, b.n0 + Math.floor(elapsed/phaseLen(c)));
  }
  function effPhase(c){ return isChallenge(c) ? "Challenge" : isTrial(c) ? "Trial" : "Phase "+phaseNum(c); }
  function nextPhaseDate(c){
    if(isTrial(c) || !c.join_date) return null;
    const n = phaseNum(c); if(n>=4) return null;
    const b = phaseBase(c); const d = new Date(b.start); d.setDate(d.getDate() + (n-b.n0+1)*phaseLen(c));
    return d;
  }
  function lastPhaseChangeDate(c){
    if(isTrial(c) || !c.join_date) return null;
    const n = phaseNum(c); const b = phaseBase(c);
    if(n<=b.n0) return b.manual ? b.start : null;
    const d = new Date(b.start); d.setDate(d.getDate() + (n-b.n0)*phaseLen(c));
    return d;
  }
  function setPhaseManual(id, n){
    const t = new Date(); const today = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    quickUpdate(id, { phase_override:"Phase "+n, phase_override_date:today, phase:"Phase "+n });
  }
  function clearPhaseManual(id){ quickUpdate(id, { phase_override:null, phase_override_date:null }); }
  function daysLeft(end){ if(!end) return null; return Math.ceil((end - new Date())/86400000); }
  function fmt(date){ if(!date) return "—"; return new Date(date).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
  function statusGroup(c){
    const d = daysLeft(calcEnd(c));
    if(d===null) return "unknown"; if(d<0) return "expired"; if(d<=7) return "critical"; if(d<=14) return "warning"; if(d<=30) return "soon"; return "active";
  }
  function waLink(phone, msg){
    if(!phone) return null;
    const digits = phone.replace(/\D/g,"");
    const withCountry = digits.length===10 ? "91"+digits : digits;
    return `https://wa.me/${withCountry}?text=${encodeURIComponent(msg)}`;
  }

  async function enableAlerts(){
    if(DEMO){ toast("In the real tracker this turns on phone alerts for this device."); return; }
    try{
      if(!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("This browser can't receive notifications. On iPhone, add the site to your Home Screen first.");
      const perm = await Notification.requestPermission();
      if(perm!=="granted") throw new Error("Notifications were blocked. Allow them in your browser settings.");
      const reg = await navigator.serviceWorker.register("/sw.js");
      const { publicKey } = await api({action:"pushkey"});
      const raw = atob(publicKey.replace(/-/g,"+").replace(/_/g,"/")); const key = new Uint8Array([...raw].map(ch=>ch.charCodeAt(0)));
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
      await api({action:"pushsub", sub: sub.toJSON()});
      toast("✅ Phone alerts are on for this device");
    }catch(e){ toast(e.message); }
  }

  function renderReminders(){
    const coaching = clients.filter(c=>!isChallenge(c)); // challenge buyers have no intro/onboarding calls or programme-end reminders
    const introPending = coaching.filter(c=>!c.intro_done);
    const onboardPending = coaching.filter(c=>!c.onboarding_done);
    const exp7 = coaching.filter(c=>{const d=daysLeft(calcEnd(c));return d!==null&&d>=0&&d<=7;});
    const exp30 = coaching.filter(c=>{const d=daysLeft(calcEnd(c));return d!==null&&d>7&&d<=30;});

    const soonPhase = clients.filter(c=>{const n=nextPhaseDate(c); if(!n||statusGroup(c)==="expired") return false; const d=Math.ceil((n-new Date())/86400000); return d<=7;});
    const justChanged = clients.filter(c=>{const l=lastPhaseChangeDate(c); if(!l||statusGroup(c)==="expired") return false; const d=Math.floor((new Date()-l)/86400000); return d>=0&&d<=7;});

    let html = "";
    const renewal = coaching.filter(c=>{ const d=daysLeft(calcEnd(c)); return d!==null && d<=15 && d>=-30; }).sort((a,b)=>daysLeft(calcEnd(a))-daysLeft(calcEnd(b)));
    if(renewal.length){
      html += `<div class="reminder-box" style="border-color:#7B0237;"><p class="reminder-title" style="color:#7B0237;">🔄 Renewals: ending within 15 days or recently ended (${renewal.length})</p>`;
      renewal.forEach(c=>{ const d=daysLeft(calcEnd(c)); const msg=`Hi ${firstName(c.name)}! 👋 Your Strong With Sherni plan ${d<0?"ended on":"ends on"} ${fmt(calcEnd(c))}. You've done so well, want to keep the momentum going? 💪\n\nYour portal: ${c.portal}`; const w=waLink(c.phone,msg);
        html += `<div class="reminder-row" style="align-items:center;flex-wrap:wrap;gap:6px;"><span><b>${c.name}</b> · ${d<0?`ended ${-d}d ago`:`${d}d left`}${c.renewal_note?` · <i style="color:var(--taupe)">${c.renewal_note}</i>`:""}</span><span>
          ${w?`<a href="${w}" target="_blank" class="btn-wa">💬 Reach out</a>`:""}
          <button class="rn-btn ${c.renewal_status==="renewed"?"on-yes":""}" onclick="setRenewal('${c.id}','renewed')">✓ Renewed</button>
          <button class="rn-btn ${c.renewal_status==="not_renewed"?"on-no":""}" onclick="setRenewal('${c.id}','not_renewed')">✗ Not renewing</button></span></div>`; });
      html += `</div>`;
    }
    if(soonPhase.length || justChanged.length){
      html += `<div class="reminder-box"><p class="reminder-title" style="color:#5B21B6;">🔄 Phase changes (${soonPhase.length+justChanged.length})</p>`;
      justChanged.forEach(c=>{ html += `<div class="reminder-row"><span>${c.name}</span><span>Now <b>${effPhase(c)}</b> · changed ${fmt(lastPhaseChangeDate(c))}</span></div>`; });
      soonPhase.forEach(c=>{ const n=nextPhaseDate(c); const d=Math.max(0,Math.ceil((n-new Date())/86400000)); html += `<div class="reminder-row"><span>${c.name}</span><span>${effPhase(c)} → Phase ${phaseNum(c)+1} in ${d}d · ${fmt(n)}</span></div>`; });
      html += `</div>`;
    }
    if(introPending.length){
      html += `<div class="reminder-box"><p class="reminder-title" style="color:#993556;">📞 Intro Call Pending (${introPending.length})</p>`;
      introPending.forEach(c=>{ html += `<div class="reminder-row"><span>${c.name}</span><button class="btn-primary" style="padding:4px 14px;font-size:12px;" onclick="quickUpdate('${c.id}',{intro_done:true})">Mark done</button></div>`; });
      html += `</div>`;
    }
    if(onboardPending.length){
      html += `<div class="reminder-box"><p class="reminder-title" style="color:#993556;">🎯 Onboarding Call Pending (${onboardPending.length})</p>`;
      onboardPending.forEach(c=>{ html += `<div class="reminder-row"><span>${c.name}</span><button class="btn-primary" style="padding:4px 14px;font-size:12px;" onclick="quickUpdate('${c.id}',{onboarding_done:true})">Mark done</button></div>`; });
      html += `</div>`;
    }
    if(exp7.length){
      html += `<div class="reminder-box urgent"><p class="reminder-title" style="color:#A32D2D;">🔴 Programme ending within 7 days (${exp7.length})</p>`;
      exp7.forEach(c=>{ const d=daysLeft(calcEnd(c)); html += `<div class="reminder-row" style="color:#A32D2D;"><span>${c.name}</span><span>${d}d left · ends ${fmt(calcEnd(c))}</span></div>`; });
      html += `</div>`;
    }
    if(exp30.length){
      html += `<div class="reminder-box soon"><p class="reminder-title" style="color:#854F0B;">🟡 Programme ending within 30 days (${exp30.length})</p>`;
      exp30.forEach(c=>{ const d=daysLeft(calcEnd(c)); html += `<div class="reminder-row" style="color:#854F0B;"><span>${c.name}</span><span>${d}d left · ends ${fmt(calcEnd(c))}</span></div>`; });
      html += `</div>`;
    }
    if(!renewal.length && !soonPhase.length && !justChanged.length && !introPending.length && !onboardPending.length && !exp7.length && !exp30.length){
      html = `<div style="text-align:center;padding:3rem 0;color:var(--taupe);">🎉 All clear! No pending reminders.</div>`;
    }
    document.getElementById("tab-reminders").innerHTML = html;
  }

  async function setRenewal(id, status){
    const c = byId(id); const now = c.renewal_status===status ? null : status;
    let note = c.renewal_note||"";
    if(now==="not_renewed"){ const n = prompt("Why are they not renewing? (optional)", note); if(n!==null) note = n; }
    await quickUpdate(id, { renewal_status: now, renewal_date: now ? new Date().toISOString().slice(0,10) : null, renewal_note: note || null });
  }

  function renderReferrals(){
    const refs = clients.filter(c=>referralsOf(c).length).sort((a,b)=>referralsOf(b).length-referralsOf(a).length);
    const total = clients.filter(c=>c.referred_by).length;
    let html = `<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card" style="background:#F3E8EE;"><p class="lbl" style="color:#7B0237;">Clients who came by referral</p><p class="val" style="color:#7B0237;">${total}</p></div>
      <div class="stat-card" style="background:#EAF3DE;"><p class="lbl" style="color:#3B6D11;">Clients who referred someone</p><p class="val" style="color:#3B6D11;">${refs.length}</p></div>
      <div class="stat-card" style="background:#FAEEDA;"><p class="lbl" style="color:#854F0B;">Bonus days given</p><p class="val" style="color:#854F0B;">${total*10}</p></div></div>`;
    if(!refs.length){ html += `<div style="text-align:center;padding:2.5rem 0;color:var(--taupe);">No referrals yet. Every client has a code in their portal. Remind them to share it! 🎁</div>`; }
    else {
      html += `<table class="tbl"><tr><th>Referred by</th><th>Code</th><th>Friends who joined</th><th>Days earned</th></tr>` + refs.map(c=>`<tr><td><b>${c.name}</b></td><td><span class="ref-chip">${c.ref_code||""}</span></td><td>${referralsOf(c).map(f=>`${f.name} <span style="color:var(--taupe)">(${fmt(f.join_date)})</span>`).join("<br>")}</td><td><b>+${referralsOf(c).length*10}</b> days</td></tr>`).join("") + `</table>`;
    }
    document.getElementById("tab-referrals").innerHTML = html;
  }

  let chartGrowth;
  function renderGrowth(){
    const months = []; const d0 = new Date(); d0.setDate(1);
    for(let i=11;i>=0;i--){ const d=new Date(d0.getFullYear(), d0.getMonth()-i, 1); months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, label:d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}); }
    const mk = v => v ? String(v).slice(0,7) : "";
    const coaching = clients.filter(c=>!isChallenge(c));
    const rowsM = months.map(m=>({ ...m,
      newC: coaching.filter(c=>mk(c.join_date)===m.key).length,
      refs: coaching.filter(c=>c.referred_by && mk(c.join_date)===m.key).length,
      ren: coaching.filter(c=>c.renewal_status==="renewed" && mk(c.renewal_date)===m.key).length,
      lost: coaching.filter(c=>c.renewal_status==="not_renewed" && mk(c.renewal_date)===m.key).length,
      rev: coaching.filter(c=>mk(c.payment_date)===m.key).reduce((s,c)=>s+Number(c.amount||0),0) }));
    const thisM = rowsM[rowsM.length-1], lastM = rowsM[rowsM.length-2];
    const inr = n => "₹"+Number(n||0).toLocaleString("en-IN");
    const diff = (a,b) => b ? (a>=b?`<span style="color:#3B6D11">▲ ${a-b}</span>`:`<span style="color:#A32D2D">▼ ${b-a}</span>`) : "";
    const decided = coaching.filter(c=>c.renewal_status).length, renewedAll = coaching.filter(c=>c.renewal_status==="renewed").length;
    let html = `<p style="font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;">This month (${thisM.label})</p>
      <div class="stat-grid">
        <div class="stat-card" style="background:#fff;border:1px solid var(--line);"><p class="lbl">New clients</p><p class="val">${thisM.newC}</p><p class="lbl">${diff(thisM.newC,lastM.newC)} vs last month</p></div>
        <div class="stat-card" style="background:#F3E8EE;"><p class="lbl" style="color:#7B0237;">Came by referral</p><p class="val" style="color:#7B0237;">${thisM.refs}</p></div>
        <div class="stat-card" style="background:#EAF3DE;"><p class="lbl" style="color:#3B6D11;">Renewed</p><p class="val" style="color:#3B6D11;">${thisM.ren}</p><p class="lbl" style="color:#3B6D11;">Renewal rate overall: ${decided?Math.round(renewedAll/decided*100)+"%":"—"}</p></div>
        <div class="stat-card" style="background:#FAEEDA;"><p class="lbl" style="color:#854F0B;">Revenue</p><p class="val" style="color:#854F0B;font-size:22px;">${inr(thisM.rev)}</p><p class="lbl" style="color:#854F0B;">from "Amount paid"</p></div>
      </div>
      <div class="chart-card" style="margin-bottom:16px;"><h4>New clients, referrals and renewals (last 12 months)</h4><div class="chart-wrap" style="height:240px"><canvas id="chart-growth"></canvas></div></div>
      <table class="tbl"><tr><th>Month</th><th>New clients</th><th>By referral</th><th>Renewed</th><th>Not renewing</th><th>Revenue</th></tr>
      ${rowsM.slice().reverse().map(r=>`<tr><td><b>${r.label}</b></td><td>${r.newC}</td><td>${r.refs}</td><td>${r.ren}</td><td>${r.lost}</td><td>${inr(r.rev)}</td></tr>`).join("")}</table>`;
    document.getElementById("tab-growth").innerHTML = html;
    if(chartGrowth) chartGrowth.destroy();
    if(document.getElementById("tab-growth").classList.contains("hidden")) return;
    chartGrowth = new Chart(document.getElementById("chart-growth"), { type:"bar",
      data:{ labels: rowsM.map(r=>r.label), datasets:[
        { label:"New clients", data: rowsM.map(r=>r.newC), backgroundColor:"#7B0237", borderRadius:5 },
        { label:"By referral", data: rowsM.map(r=>r.refs), backgroundColor:"#E8A0BC", borderRadius:5 },
        { label:"Renewed", data: rowsM.map(r=>r.ren), backgroundColor:"#4D8A1F", borderRadius:5 } ] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{size:11} } } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } } });
  }

  function fillReferredBy(selected, selfId){
    const sel = document.getElementById("f-referredby");
    sel.innerHTML = `<option value="">— Nobody —</option>` + clients.filter(c=>c.id!==selfId).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${c.name}${c.ref_code?" · "+c.ref_code:""}</option>`).join("");
  }

    ["f-name","f-email","f-password","f-phone","f-join","f-payment","f-onboard-date","f-notes","f-amount","f-coachnote","f-renewal","f-renewalnote"].forEach(id=>document.getElementById(id).value="");

    document.getElementById("f-duration").value = "3 months";
    document.getElementById("f-phaseweeks").value = "4";

    document.getElementById("f-ext").value = 0;

  function openEditModal(id){
    const c = clients.find(x=>x.id===id);
    if(!c) return;
    editingId = id;
    document.getElementById("modal-title").textContent = "Edit Client";
    document.getElementById("f-name").value = c.name;

    document.getElementById("f-password").value = c.password||"";
    document.getElementById("f-phone").value = c.phone||"";

    document.getElementById("f-renewalnote").value = c.renewal_note||"";

    document.getElementById("f-refcode").value = ""; document.getElementById("f-refmsg").textContent = "";

    document.getElementById("f-onboard").checked = c.onboarding_done||false;
    document.getElementById("f-notes").value = c.notes||"";
    document.getElementById("modal-error").classList.add("hidden");
    document.getElementById("client-modal").classList.remove("hidden");
  }
  function closeModal(){ document.getElementById("client-modal").classList.add("hidden"); }

  async function saveClient(){
    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-password").value;
    const joinDate = document.getElementById("f-join").value;
    const errEl = document.getElementById("modal-error");
    if(!name || !email || !joinDate){
      errEl.textContent = "Name, email and join date are required.";
      errEl.classList.remove("hidden");
      return;
    }
    const payload = {
      name, email, ...(password ? { password } : {}),
      phone: document.getElementById("f-phone").value.trim(),
      join_date: joinDate,
      payment_date: document.getElementById("f-payment").value || null,
      onboarding_date: document.getElementById("f-onboard-date").value || null,
      duration: document.getElementById("f-duration").value,
      phase_weeks: Number(document.getElementById("f-phaseweeks").value)||4,
      pause_days: Number(document.getElementById("f-pause").value)||0,
      extension_days: Number(document.getElementById("f-ext").value)||0,
      referral_days: Number(document.getElementById("f-ref").value)||0,
      payment_status: document.getElementById("f-paystatus").value,
      intro_done: document.getElementById("f-intro").checked,
      onboarding_done: document.getElementById("f-onboard").checked,
      notes: document.getElementById("f-notes").value,
      amount: document.getElementById("f-amount").value ? Number(document.getElementById("f-amount").value) : null,
      coach_note: document.getElementById("f-coachnote").value.trim() || null,
      referred_by: document.getElementById("f-referredby").value || null,
      renewal_status: document.getElementById("f-renewal").value || null,
      renewal_note: document.getElementById("f-renewalnote").value.trim() || null
    };
    const prev = editingId ? byId(editingId) : null;
    if(payload.renewal_status && (!prev || prev.renewal_status!==payload.renewal_status)) payload.renewal_date = new Date().toISOString().slice(0,10);
    const newRef = payload.referred_by && (!prev || prev.referred_by!==payload.referred_by) ? byId(payload.referred_by) : null;

    payload.phase = effPhase({...(clients.find(x=>x.id===editingId)||{}), ...payload});
    let savedRes;
    try{ savedRes = await api({action:"save", id: editingId||undefined, data: payload}); }
    catch(e){ errEl.textContent = "Save failed: "+e.message; errEl.classList.remove("hidden"); return; }
    const fromForm = !!(pendingSignupId && !editingId); pendingSignupId = null;
    closeModal();
    flashSave("Saved ✓");
    if(newRef && !fromForm && !(prev && prev.referral_credited)) toast(`🎁 +10 days added to ${firstName(newRef.name)}'s plan`);
    await loadClients();
  }

  async function quickUpdate(id, patch){
    try{ await api({action:"save", id, data: patch}); }catch(e){ alert("Update failed: "+e.message); return; }
    flashSave("Saved ✓");
    await loadClients();
  }

  async function deleteClient(id){
    if(!confirm("Delete this client?")) return;
    try{ await api({action:"delete", id}); }catch(e){ alert("Delete failed: "+e.message); return; }
    await loadClients();
  }

  function exportCSV(){
    const headers = ["Name","Email","Phone","Phase","Duration","Join Date","Payment Date","Onboarding Date","Pause Days","Extension Days","Referral Days","End Date","Days Remaining","Payment Status","Intro Call","Onboarding Call","Notes","Amount","Referral Code","Referred By","Renewal","Portal Link"];
    const rows = clients.map(c=>{
      const end = calcEnd(c); const days = daysLeft(end);
      return [c.name,c.email,c.phone||"",effPhase(c),c.duration,fmt(c.join_date),fmt(c.payment_date),fmt(c.onboarding_date),c.pause_days||0,c.extension_days||0,c.referral_days||0,fmt(end),days!==null?Math.max(0,days):"",c.payment_status||"pending",c.intro_done?"Done":"Pending",c.onboarding_done?"Done":"Pending",c.notes||"",c.amount||"",c.ref_code||"",c.referred_by?(byId(c.referred_by)||{}).name||"":"",c.renewal_status||"",c.portal||""];
    });
    const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download = "sherni-clients.csv";
    a.click();
  }
